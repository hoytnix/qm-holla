<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stopColor="#1e1b4b" />
      <stop offset="60%" stopColor="#0f172a" />
      <stop offset="100%" stopColor="#030712" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fef08a" />
      <stop offset="50%" stopColor="#fbbf24" />
      <stop offset="100%" stopColor="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark radial gradient background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Outer orbital ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#6366f1" stroke-width="3" stroke-dasharray="8 8" opacity="0.4" />

  <!-- Quark atom orbital ellipses -->
  <ellipse cx="256" cy="256" rx="170" ry="65" fill="none" stroke="url(#goldGrad)" stroke-width="7" opacity="0.85" transform="rotate(30 256 256)" filter="url(#glow)" />
  <ellipse cx="256" cy="256" rx="170" ry="65" fill="none" stroke="url(#goldGrad)" stroke-width="7" opacity="0.85" transform="rotate(90 256 256)" filter="url(#glow)" />
  <ellipse cx="256" cy="256" rx="170" ry="65" fill="none" stroke="url(#goldGrad)" stroke-width="7" opacity="0.85" transform="rotate(150 256 256)" filter="url(#glow)" />

  <!-- Gold Anchor Core Symbol -->
  <g id="anchor" filter="url(#glow)">
    <!-- Anchor Ring -->
    <circle cx="256" cy="140" r="26" fill="none" stroke="url(#goldGrad)" stroke-width="12" />
    <!-- Anchor Shank -->
    <line x1="256" y1="166" x2="256" y2="350" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" />
    <!-- Anchor Stock -->
    <line x1="196" y1="205" x2="316" y2="205" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" />
    <!-- Anchor Flukes / Curved Arm -->
    <path d="M 160 310 Q 256 420 352 310" fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round" />
    <!-- Fluke tips / arrows -->
    <polygon points="160,310 146,275 185,295" fill="url(#goldGrad)" />
    <polygon points="352,310 366,275 327,295" fill="url(#goldGrad)" />
  </g>

  <!-- Quark Nucleus / Center Atom Node -->
  <circle cx="256" cy="256" r="24" fill="#fbbf24" filter="url(#glow)" />
  <circle cx="256" cy="256" r="14" fill="#ffffff" />
</svg>
